<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surveyor</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: ui-monospace, Menlo, monospace; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud { position: fixed; left: 12px; top: 12px; color: #ddd; font-size: 12px; line-height: 1.5; background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px; pointer-events: none; white-space: pre; }
      #panel { position: fixed; right: 12px; top: 12px; color: #ddd; font-size: 12px; background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px; width: 260px; }
      #panel label { display: block; margin: 4px 0; }
      #panel input[type=range] { width: 150px; vertical-align: middle; }
      #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); color: #fff; font-size: 16px; }
      .big { font-size: 14px; color: #fff; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="overlay" style="position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none"></canvas>
    <div id="status">loading…</div>
    <div id="hud"></div>
    <div id="panel">
      <label class="big">curvature k <input id="curv" type="range" min="-1" max="1" step="0.001" value="0" /> <span id="curvV">0</span></label>
      <label><input id="mode" type="checkbox" checked /> curved renderer (unchecked = Phase 1 flat reference)</label>
      <label>quality <select id="quality"><option value="auto" selected>auto (target 30 fps)</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option></select></label>
      <label>scale <input id="scale" type="range" min="0.25" max="1" step="0.05" value="1" /> <span id="scaleV">1.00</span></label>
      <label>FOV <input id="fov" type="range" min="50" max="100" step="1" value="70" /> <span id="fovV">70°</span></label>
      <label>mouse <input id="sens" type="range" min="0.5" max="3" step="0.1" value="1" /></label>
      <label><input id="tints" type="checkbox" checked /> tint walls by face pair</label>
      <button id="galleryBtn" style="margin:4px 0;background:#2a3050;color:#eee;border:0;padding:5px 10px;border-radius:6px;cursor:pointer">space gallery (G)</button>
      <label class="big">level <select id="level"></select></label>
      <label>space <select id="topo"></select></label>
      <label>camera <select id="cams"></select></label>
      <label><input id="nearcull" type="checkbox" /> near-camera cull (repo parity)</label>
      <label><input id="repopix" type="checkbox" /> repo pixel grid (edges at ±1)</label>
      <label><input id="floor" type="checkbox" checked /> stay on the eye plane (no Q/E)</label>
      <label><input id="collide" type="checkbox" checked /> collisions</label>
      <label><input id="lighting" type="checkbox" checked /> lighting (P lamp · T flare · F flashlight)</label>
      <label>ambient <input id="ambient" type="range" min="0" max="1" step="0.01" value="0.25" /></label>
      <label>fog σ (1/m) <input id="fog" type="range" min="0" max="0.2" step="0.005" value="0.04" /></label>
      <label><input id="audio" type="checkbox" /> audio (lamps hum, flares crackle)</label>
      <div>WASD move · drag to look · shift = fast</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
